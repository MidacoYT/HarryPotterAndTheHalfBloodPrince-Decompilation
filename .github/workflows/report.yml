name: decomp.dev report

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate objdiff report
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("report.json").read_text(encoding="utf-8"))
          if report.get("version") != 2:
              raise SystemExit("report.json must be an objdiff report version 2")
          if not report.get("units"):
              raise SystemExit("report.json has no units")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: pc_report
          path: report.json
          if-no-files-found: error
          retention-days: 90
